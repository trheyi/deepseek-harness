# Test config for @deepseek-ai/dsh-yaoapp-jsonrpc-stream.
# Uses the yaoapp stream plugin instead of the official jsonrpc-server.
# stdout is reserved for JSON-RPC; no console logger.

- id: yaoapp-jsonrpc-stream
  name: '@deepseek-ai/dsh-yaoapp-jsonrpc-stream'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  config:
    enableRunInBackground: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 16384

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

- id: invariants
  name: '@deepseek-ai/dsh-invariants'

- id: session-invariant
  name: '@deepseek-ai/dsh-session/invariant'

- id: agent-invariant
  name: '@deepseek-ai/dsh-agent/invariant'

- id: scope-invariant
  name: '@deepseek-ai/dsh-scope/invariant'

- id: agent-loop-invariant
  name: '@deepseek-ai/dsh-agent-loop/invariant'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
